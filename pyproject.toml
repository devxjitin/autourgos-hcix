[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autourgos-hcix"
version = "3.2.2"
description = "Human Cognitive Interrupt middleware for Autourgos agents with global hotkey steering."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    {name = "Jitin Kumar Sengar", email = "devxjitin@gmail.com"}
]
maintainers = [
    {name = "Sonia"},
    {name = "Vishwanil Suman"},
]
keywords = ["autourgos", "agent", "middleware", "human-in-the-loop", "interrupt", "hotkey", "hcix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["autourgos-agent>=3.1.0"]

[project.optional-dependencies]
hcix = ["pynput>=1.7.6"]

[project.urls]
Homepage = "https://github.com/devxjitin/autourgos-hcix"
Repository = "https://github.com/devxjitin/autourgos-hcix"
Issues = "https://github.com/devxjitin/autourgos-hcix/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["autourgos_hcix*"]

[tool.setuptools.package-data]
autourgos_hcix = ["py.typed"]
